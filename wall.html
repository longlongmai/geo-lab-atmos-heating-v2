<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大气受热过程 · 全班作品墙</title>
<style>
  :root {
    --navy: #16324f;
    --ink: #1e2b3a;
    --muted: #5b6b7c;
    --line: #cfe0ee;
    --bg: #eef5fb;
    --accent: #1f8fc4;
    --gold: #f5b400;
    --ok: #2e9b57;
    --danger: #c0473f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
    background: var(--bg); color: var(--ink); display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 8px 14px; background: var(--navy); color: #fff; flex-shrink: 0;
  }
  header h1 { font-size: 1.15rem; white-space: nowrap; }
  header .meta { font-size: .9rem; opacity: .9; }
  .live { font-size: .8rem; padding: 3px 10px; border-radius: 20px; background: rgba(255,255,255,.14); white-space: nowrap; }
  .live::before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #6ee39a; margin-right: 6px; vertical-align: 1px; }
  .live.bad::before { background: #ff8a80; }
  .tools { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
  .tools button, .tools select {
    font: inherit; font-size: .9rem; font-weight: 600; color: var(--navy);
    background: #fff; border: 0; border-radius: 8px; padding: 7px 11px; cursor: pointer;
  }
  .tools button:hover { background: #e3f1fb; }

  .grid {
    flex: 1; overflow: auto; padding: 16px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 16px; align-content: start;
  }
  .empty { margin: auto; text-align: center; color: var(--muted); font-size: 1.2rem; line-height: 1.9; padding: 20px; }
  .empty small { font-size: .95rem; }
  .card {
    background: #fff; border-radius: 14px; overflow: hidden; cursor: pointer; position: relative;
    box-shadow: 0 6px 22px rgba(40, 90, 140, .14); border: 3px solid transparent;
    transition: transform .12s, border-color .3s;
  }
  .card:hover { transform: translateY(-2px); border-color: var(--accent); }
  .card.fresh { border-color: var(--gold); animation: pop .6s ease-out; }
  @keyframes pop { 0% { transform: scale(.94); opacity: .3; } 100% { transform: scale(1); opacity: 1; } }
  .card svg { width: 100%; display: block; background: #dcecf8; }
  .card .cap { display: flex; align-items: baseline; gap: 10px; padding: 10px 14px 4px; }
  .card .cap b { font-size: 1.1rem; color: var(--navy); }
  .card .cap span { font-size: .82rem; color: var(--muted); }
  .card .cap small { font-size: .8rem; color: var(--muted); margin-left: auto; white-space: nowrap; }
  .card .note { font-size: .88rem; color: var(--ink); padding: 0 14px 12px; line-height: 1.5;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 8px; }
  .badge {
    position: absolute; top: 10px; right: 10px; background: var(--ok); color: #fff;
    font-weight: 700; font-size: 1.15rem; padding: 4px 12px; border-radius: 20px; box-shadow: 0 3px 10px rgba(0,0,0,.2);
  }
  .badge small { font-size: .75rem; font-weight: 400; opacity: .85; }
  .badge.none { background: rgba(22, 50, 79, .6); font-size: .8rem; font-weight: 400; }

  /* 放大查看 + 评分 */
  .view { position: fixed; inset: 0; z-index: 60; background: rgba(10, 25, 40, .96); display: flex; flex-direction: column; }
  .view[hidden] { display: none; }
  .view header { background: #0d1c2c; margin-bottom: 10px; }
  .view .body { flex: 1; min-height: 0; display: flex; gap: 14px; padding: 0 14px 14px; }
  .view .big { flex: 1; min-width: 0; position: relative; display: flex; align-items: center; }
  .view .big svg { width: 100%; max-height: 100%; display: block; border-radius: 10px; }
  .view .side {
    width: 340px; flex-shrink: 0; background: #fff; border-radius: 12px; padding: 16px; overflow: auto;
    display: flex; flex-direction: column; gap: 12px;
  }
  .side h3 { font-size: .95rem; color: var(--muted); font-weight: 600; }
  .side .note { font-size: 1rem; line-height: 1.6; white-space: pre-wrap; background: #f4f9fd; border-radius: 8px; padding: 10px 12px; }
  .side .note.emptyNote { color: var(--muted); font-size: .9rem; }
  .crit { border-top: 1px solid var(--line); padding-top: 10px; }
  .crit .t { display: flex; justify-content: space-between; align-items: baseline; font-weight: 700; color: var(--navy); }
  .crit .t span { font-weight: 400; font-size: .85rem; color: var(--muted); }
  .crit .hint { font-size: .8rem; color: var(--muted); margin: 2px 0 6px; line-height: 1.4; }
  .pts { display: flex; gap: 6px; flex-wrap: wrap; }
  .pts button {
    font: inherit; font-weight: 700; font-size: 1rem; width: 44px; height: 40px; border-radius: 8px;
    border: 1.5px solid var(--line); background: #fff; color: var(--navy); cursor: pointer;
  }
  .pts button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .pts.ro button { cursor: default; }
  .total { font-size: 1.6rem; font-weight: 700; color: var(--ok); }
  .total small { font-size: .9rem; color: var(--muted); font-weight: 400; }
  .side textarea { width: 100%; font: inherit; font-size: .95rem; padding: 8px 10px; border-radius: 8px; border: 1.5px solid var(--line); height: 70px; resize: vertical; }
  .side .save { font: inherit; font-weight: 700; font-size: 1rem; padding: 10px; border-radius: 8px; border: 0; background: var(--ok); color: #fff; cursor: pointer; }
  .side .save:disabled { opacity: .5; cursor: default; }
  .side .remark { font-size: .95rem; line-height: 1.5; }
  .nav {
    position: absolute; top: 50%; transform: translateY(-50%); width: 54px; height: 54px; border-radius: 50%;
    border: 0; background: rgba(255,255,255,.92); color: var(--navy); font-size: 1.8rem; line-height: 1; cursor: pointer; z-index: 2;
  }
  .nav:disabled { opacity: .2; cursor: default; }
  .nav.prev { left: 8px; }
  .nav.next { right: 8px; }

  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(20px);
    background: var(--navy); color: #fff; padding: 8px 16px; border-radius: 20px; font-size: .95rem;
    opacity: 0; transition: all .25s; pointer-events: none; z-index: 100;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 900px) {
    .grid { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); padding: 10px; gap: 10px; }
    .view .body { flex-direction: column; overflow: auto; }
    .view .big { flex: none; }
    .view .side { width: auto; }
  }
</style>
</head>
<body>

<header>
  <h1>🖼 全班作品墙</h1>
  <span class="meta" id="meta">正在连接…</span>
  <span class="live" id="live">实时</span>
  <div class="tools">
    <select id="sort" title="排序">
      <option value="time">按提交时间</option>
      <option value="name">按小组名称</option>
      <option value="score">按得分</option>
    </select>
    <button id="bFull">⛶ 全屏</button>
  </div>
</header>

<div class="grid" id="grid"></div>

<div class="view" id="view" hidden>
  <header>
    <h1 id="vName"></h1>
    <span class="meta" id="vMeta"></span>
    <div class="tools">
      <button id="vShot">📸 保存图片</button>
      <button id="vClose">✕ 返回作品墙</button>
    </div>
  </header>
  <div class="body">
    <div class="big" id="vBig">
      <button class="nav prev" id="vPrev" title="上一组 (←)">‹</button>
      <button class="nav next" id="vNext" title="下一组 (→)">›</button>
    </div>
    <div class="side" id="vSide"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="scene.js"></script>
<script>
(() => {
  const { buildStaticSvg, exportPng, fmtTime } = GeoScene;
  const $ = id => document.getElementById(id);
  const CLASS = GeoScene.readClass();
  const TEACHER = /[#&]t=1\b/.test(location.hash);   // 老师链接可以打分，学生链接只能查看
  const POLL = TEACHER ? 4000 : 10000;

  let data = null;            // 最近一次读取的课堂数据
  let order = [];             // 当前排序后的小组名
  let viewName = null;        // 正在放大查看的小组
  let draft = null;           // 老师正在打的分（未保存）
  const seen = new Map();     // 小组名 → 已显示过的提交时间，用于高亮新提交（首次加载不高亮）
  let loadedOnce = false;

  let toastTimer;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
  }

  const rubric = () => (data && Array.isArray(data.config.rubric) && data.config.rubric.length ? data.config.rubric : GeoScene.DEFAULT_RUBRIC);
  const maxScore = () => rubric().reduce((s, r) => s + (+r.max || 0), 0);

  // ---------- 读取（轮询） ----------
  let busy = false, timer = null;
  async function refresh(force) {
    if (busy) return;
    busy = true;
    try {
      const d = await GeoScene.loadClass(CLASS);
      $('live').classList.remove('bad');
      $('live').textContent = '实时 · ' + new Date().toLocaleTimeString('zh-CN', { hour12: false });
      if (d.changed || force || !data) {
        data = d;
        render();
      }
    } catch (e) {
      $('live').classList.add('bad');
      $('live').textContent = e.status ? e.message : '网络中断，正在重试';
      if (!data) $('grid').innerHTML = `<div class="empty">连接不上这节课<br><small>${e.status ? e.message : '请检查网络，页面会自动重试'}</small></div>`;
    } finally {
      busy = false;
      clearTimeout(timer);
      timer = setTimeout(() => refresh(), document.hidden ? POLL * 3 : POLL);
    }
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });

  // ---------- 作品墙 ----------
  function sortNames() {
    const by = $('sort').value;
    const names = [...data.works.keys()];
    const sc = n => (data.scores.get(n) || { total: -1 }).total;
    if (by === 'name') names.sort((a, b) => a.localeCompare(b, 'zh-CN', { numeric: true }));
    else if (by === 'score') names.sort((a, b) => sc(b) - sc(a) || a.localeCompare(b, 'zh-CN', { numeric: true }));
    else names.sort((a, b) => data.works.get(a).time - data.works.get(b).time);
    return names;
  }

  function render() {
    document.title = `${data.title} · 全班作品墙`;
    const n = data.works.size, scored = [...data.works.keys()].filter(k => data.scores.has(k)).length;
    $('meta').textContent = `${data.title} · 已提交 ${n} 组` + (n ? ` · 已评分 ${scored} 组` : '') + (TEACHER ? ' · 老师评分模式' : '');
    order = sortNames();
    const grid = $('grid');
    grid.innerHTML = '';
    if (!n) {
      grid.innerHTML = `<div class="empty">还没有小组提交<br><small>学生在平板上完成模型后点“📤 提交给老师”，作品会自动出现在这里</small></div>`;
    }
    order.forEach(name => {
      const w = data.works.get(name), s = data.scores.get(name);
      const card = document.createElement('div');
      card.className = 'card';
      if (loadedOnce && seen.get(name) !== w.time) card.classList.add('fresh');
      card.appendChild(buildStaticSvg(w));
      const badge = document.createElement('div');
      badge.className = 'badge' + (s ? '' : ' none');
      badge.innerHTML = s ? `${s.total}<small> / ${maxScore()}</small>` : '待评分';
      card.appendChild(badge);
      const cap = document.createElement('div');
      cap.className = 'cap';
      cap.innerHTML = '<b></b><span></span><small></small>';
      cap.querySelector('b').textContent = name;
      cap.querySelector('span').textContent = `${w.arrows.length} 支箭头` + (w.versions > 1 ? ` · 第 ${w.versions} 次提交` : '');
      cap.querySelector('small').textContent = fmtTime(w.time);
      card.appendChild(cap);
      const note = document.createElement('div');
      note.className = 'note';
      note.textContent = w.note;
      card.appendChild(note);
      card.onclick = () => openView(name);
      grid.appendChild(card);
    });
    data.works.forEach((w, k) => seen.set(k, w.time));
    loadedOnce = true;
    if (viewName) openView(viewName, true);
  }
  $('sort').onchange = () => data && render();

  // ---------- 放大查看 + 评分 ----------
  function openView(name, refreshing) {
    const w = data.works.get(name);
    if (!w) { closeView(); return; }
    const changedGroup = name !== viewName;
    viewName = name;
    const i = order.indexOf(name);
    $('vName').textContent = name;
    $('vMeta').textContent = `${w.arrows.length} 支箭头 · ${fmtTime(w.time)}` + (w.versions > 1 ? ` · 第 ${w.versions} 次提交` : '') + ` · ${i + 1} / ${order.length}`;
    const big = $('vBig');
    big.querySelectorAll('svg').forEach(s => s.remove());
    big.appendChild(buildStaticSvg(w));
    $('vPrev').disabled = i <= 0;
    $('vNext').disabled = i >= order.length - 1;
    // 老师正在打分时，轮询刷新不打断输入
    if (!(refreshing && TEACHER && draft && !changedGroup)) renderSide(name);
    $('view').hidden = false;
  }
  function closeView() { $('view').hidden = true; viewName = null; draft = null; }

  function renderSide(name) {
    const w = data.works.get(name), s = data.scores.get(name);
    const side = $('vSide');
    side.innerHTML = '';
    const h = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; side.appendChild(e); return e; };
    h('h3', '', '小组说明');
    h('div', 'note' + (w.note ? '' : ' emptyNote'), w.note || '（没有填写说明）');

    const cur = TEACHER ? (draft = { scores: { ...(s ? s.scores : {}) }, remark: s ? s.remark : '' }) : null;
    h('h3', '', TEACHER ? '评分' : '老师评分');
    if (!TEACHER && !s) { h('div', 'note emptyNote', '老师还没有给这一组打分'); return; }
    const totalEl = document.createElement('div');
    const updateTotal = () => {
      const src = TEACHER ? cur.scores : s.scores;
      const sum = rubric().reduce((t, r) => t + (+src[r.name] || 0), 0);
      totalEl.innerHTML = `${sum}<small> / ${maxScore()} 分</small>`;
      return sum;
    };
    rubric().forEach(r => {
      const box = h('div', 'crit');
      box.innerHTML = '<div class="t"></div><div class="hint"></div><div class="pts"></div>';
      box.querySelector('.t').textContent = r.name;
      box.querySelector('.t').insertAdjacentHTML('beforeend', `<span>满分 ${r.max}</span>`);
      box.querySelector('.hint').textContent = r.hint || '';
      const pts = box.querySelector('.pts');
      if (!TEACHER) pts.classList.add('ro');
      const val = () => (TEACHER ? cur.scores : s.scores)[r.name];
      for (let v = 0; v <= +r.max; v++) {
        const b = document.createElement('button');
        b.textContent = v;
        if (val() === v) b.classList.add('on');
        if (TEACHER) b.onclick = () => {
          cur.scores[r.name] = v;
          pts.querySelectorAll('button').forEach(x => x.classList.toggle('on', +x.textContent === v));
          updateTotal();
        };
        pts.appendChild(b);
      }
    });
    totalEl.className = 'total';
    side.appendChild(totalEl);
    updateTotal();
    if (TEACHER) {
      const ta = document.createElement('textarea');
      ta.placeholder = '点评（选填，会显示给学生）';
      ta.value = cur.remark;
      ta.oninput = () => { cur.remark = ta.value; };
      side.appendChild(ta);
      const btn = document.createElement('button');
      btn.className = 'save';
      btn.textContent = s ? '更新评分' : '保存评分';
      btn.onclick = async () => {
        const missing = rubric().filter(r => cur.scores[r.name] == null).map(r => r.name);
        if (missing.length) { toast('还没打分：' + missing.join('、')); return; }
        btn.disabled = true; btn.textContent = '保存中…';
        try {
          await GeoScene.submitScore(CLASS, name, cur.scores, updateTotal(), cur.remark.trim());
          toast(`已保存：${name} ${updateTotal()} 分`);
          draft = null;
          await refresh(true);
        } catch (e) {
          btn.disabled = false; btn.textContent = '重新保存';
          toast('保存失败：' + (e.status ? e.message : '网络连接不上 GitHub'));
        }
      };
      side.appendChild(btn);
    } else if (s.remark) {
      h('h3', '', '老师点评');
      h('div', 'remark', s.remark);
    }
  }

  const step = d => { const i = order.indexOf(viewName) + d; if (order[i]) { draft = null; openView(order[i]); } };
  $('vPrev').onclick = () => step(-1);
  $('vNext').onclick = () => step(1);
  $('vClose').onclick = closeView;
  $('vShot').onclick = () => { const w = data.works.get(viewName); if (w) exportPng(w).then(() => toast('图片已保存')); };
  $('bFull').onclick = () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
  };
  window.addEventListener('keydown', e => {
    if (e.target.tagName === 'TEXTAREA' || $('view').hidden) return;
    if (e.key === 'ArrowLeft') step(-1);
    else if (e.key === 'ArrowRight') step(1);
    else if (e.key === 'Escape') closeView();
  });

  // ---------- 启动 ----------
  if (!CLASS) {
    $('meta').textContent = '';
    $('live').hidden = true;
    $('grid').innerHTML = '<div class="empty">请通过老师给的上课链接打开作品墙</div>';
  } else {
    refresh();
  }
})();
</script>
</body>
</html>
