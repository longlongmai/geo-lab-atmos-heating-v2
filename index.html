<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大气受热过程 · 小组拖拽建模</title>
<style>
  :root {
    --navy: #16324f;
    --ink: #1e2b3a;
    --muted: #5b6b7c;
    --line: #cfe0ee;
    --panel: #ffffff;
    --bg: #eef5fb;
    --accent: #1f8fc4;
    --sw: #f5b400;       /* 短波 */
    --lw: #f0663a;       /* 长波 */
    --ok: #2e9b57;
    --warn: #e07b00;
    --danger: #c0473f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
    background: var(--bg); color: var(--ink);
    display: flex; flex-direction: column; overflow: hidden;
    -webkit-user-select: none; user-select: none;
  }

  /* ---------- 顶栏 ---------- */
  header {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 8px 14px; background: var(--navy); color: #fff; flex-shrink: 0;
  }
  header h1 { font-size: 1.15rem; font-weight: 700; letter-spacing: .5px; white-space: nowrap; }
  header .task { font-size: .92rem; opacity: .9; flex: 1 1 320px; line-height: 1.35; }
  .tools { display: flex; gap: 6px; flex-wrap: wrap; }
  .tools button {
    font: inherit; font-size: .9rem; font-weight: 600; color: var(--navy);
    background: #fff; border: 0; border-radius: 8px; padding: 7px 11px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
    transition: background .15s, transform .1s;
  }
  .tools button:hover:not(:disabled) { background: #e3f1fb; }
  .tools button:active:not(:disabled) { transform: translateY(1px); }
  .tools button:disabled { opacity: .45; cursor: default; }
  .tools button.on { background: #ffd666; }
  .tools .sep { width: 1px; background: rgba(255,255,255,.3); margin: 2px 2px; }

  /* ---------- 主区 ---------- */
  main { flex: 1; display: flex; min-height: 0; }
  .stage { flex: 1; min-width: 0; padding: 10px; display: flex; align-items: center; justify-content: center; position: relative; }
  #scene {
    width: 100%; height: 100%; display: block; touch-action: none;
    background: #dcecf8; border-radius: 14px; box-shadow: 0 6px 22px rgba(40, 90, 140, .18);
  }
  .tip {
    position: absolute; left: 22px; bottom: 18px; font-size: .8rem; color: #fff;
    background: rgba(22, 50, 79, .55); padding: 4px 10px; border-radius: 20px; pointer-events: none;
  }

  aside {
    width: 300px; flex-shrink: 0; background: var(--panel); border-left: 1px solid var(--line);
    display: flex; flex-direction: column; min-height: 0;
  }
  aside h2 { font-size: 1rem; color: var(--navy); padding: 12px 14px 6px; display: flex; justify-content: space-between; align-items: baseline; }
  aside h2 small { font-size: .75rem; color: var(--muted); font-weight: 400; }
  .lib { padding: 4px 12px 8px; display: flex; flex-direction: column; gap: 8px; }
  .item {
    display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px;
    border: 1.5px solid var(--line); background: #f7fbfe; cursor: grab; touch-action: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .item:hover { border-color: var(--accent); box-shadow: 0 3px 10px rgba(31, 143, 196, .15); }
  .item svg { flex-shrink: 0; }
  .item span { font-size: .98rem; font-weight: 600; }
  .item .count { margin-left: auto; font-size: .75rem; color: var(--muted); font-weight: 400; }
  .legend { display: flex; gap: 14px; padding: 2px 14px 10px; font-size: .8rem; color: var(--muted); }
  .legend i { display: inline-block; width: 18px; height: 6px; border-radius: 3px; vertical-align: middle; margin-right: 5px; }

  .group { padding: 8px 14px 10px; border-top: 1px solid var(--line); }
  .group label { font-size: .85rem; color: var(--muted); display: block; margin-bottom: 4px; }
  .group input {
    width: 100%; font: inherit; font-size: .95rem; padding: 7px 10px; border-radius: 8px;
    border: 1.5px solid var(--line); outline: none; -webkit-user-select: text; user-select: text;
  }
  .group input:focus { border-color: var(--accent); }


  /* 拖拽幽灵 */
  .ghost {
    position: fixed; left: 0; top: 0; pointer-events: none; z-index: 99;
    padding: 6px 10px; border-radius: 8px; background: rgba(255,255,255,.92);
    box-shadow: 0 6px 18px rgba(0,0,0,.18); font-weight: 600; font-size: .9rem;
    display: flex; align-items: center; gap: 8px; transform: translate(-50%, -50%);
  }

  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(20px);
    background: var(--navy); color: #fff; padding: 8px 16px; border-radius: 20px; font-size: .9rem;
    opacity: 0; transition: all .25s; pointer-events: none; z-index: 100;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* SVG 内样式 */
  .lbl { font-weight: 700; paint-order: stroke; stroke: #fff; stroke-width: 5px; stroke-linejoin: round; fill: var(--ink); }
  .arrow { cursor: move; }
  .handle { cursor: pointer; }
  .handle.wh { cursor: ew-resize; }

  /* ---------- 作品墙 ---------- */
  .wall {
    position: fixed; inset: 0; z-index: 50; background: var(--bg);
    display: flex; flex-direction: column;
  }
  .wall[hidden] { display: none; }
  .wall-head {
    display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
    padding: 8px 14px; background: var(--navy); color: #fff; flex-shrink: 0;
  }
  .wall-head h2 { font-size: 1.15rem; }
  .wall-head small { font-size: .85rem; opacity: .85; }
  .wall-head .tools { margin-left: auto; }
  .wall-grid {
    flex: 1; overflow: auto; padding: 16px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 16px; align-content: start;
  }
  .wall-grid:empty { display: none; }
  .wall-empty { display: none; margin: auto; text-align: center; color: var(--muted); font-size: 1.15rem; line-height: 1.9; }
  .wall-grid:empty + .wall-empty { display: block; }
  .card {
    background: #fff; border-radius: 14px; overflow: hidden; cursor: pointer;
    box-shadow: 0 6px 22px rgba(40, 90, 140, .14); border: 3px solid transparent;
    transition: transform .12s, border-color .12s;
  }
  .card:hover { transform: translateY(-2px); border-color: var(--accent); }
  .card svg { width: 100%; display: block; background: #dcecf8; }
  .card .cap { display: flex; align-items: baseline; gap: 10px; padding: 10px 14px; }
  .card .cap b { font-size: 1.05rem; color: var(--navy); }
  .card .cap span { font-size: .85rem; color: var(--muted); }
  .card .cap small { font-size: .8rem; color: var(--muted); margin-left: auto; }

  /* 单组放大查看 */
  .view { position: fixed; inset: 0; z-index: 60; background: rgba(10, 25, 40, .94); display: flex; flex-direction: column; }
  .view[hidden] { display: none; }
  .view .wall-head { background: transparent; }
  .view .big { flex: 1; min-height: 0; padding: 4px 76px 18px; }
  .view .big svg { width: 100%; height: 100%; display: block; }
  .view .nav {
    position: absolute; top: 50%; transform: translateY(-50%); width: 58px; height: 58px; border-radius: 50%;
    border: 0; background: rgba(255,255,255,.92); color: var(--navy); font-size: 1.9rem; line-height: 1; cursor: pointer;
  }
  .view .nav:disabled { opacity: .25; cursor: default; }
  .view .nav.prev { left: 10px; }
  .view .nav.next { right: 10px; }

  /* 课堂模式：提交弹层 */
  .modal { position: fixed; inset: 0; z-index: 70; background: rgba(10, 25, 40, .55); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal[hidden] { display: none; }
  .modal .box { background: #fff; border-radius: 14px; padding: 18px 20px; width: min(560px, 100%); box-shadow: 0 12px 40px rgba(0,0,0,.25); }
  .modal h3 { font-size: 1.15rem; color: var(--navy); margin-bottom: 4px; }
  .modal p { font-size: .88rem; color: var(--muted); line-height: 1.5; margin-bottom: 12px; }
  .modal label { display: block; font-size: .88rem; color: var(--muted); margin: 10px 0 4px; }
  .modal input, .modal textarea {
    width: 100%; font: inherit; font-size: 1rem; padding: 8px 10px; border-radius: 8px;
    border: 1.5px solid var(--line); outline: none; -webkit-user-select: text; user-select: text;
  }
  .modal textarea { height: 96px; resize: vertical; }
  .modal input:focus, .modal textarea:focus { border-color: var(--accent); }
  .modal .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
  .modal .row button { font: inherit; font-size: .95rem; font-weight: 600; padding: 9px 16px; border-radius: 8px; border: 0; cursor: pointer; background: #e3f1fb; color: var(--navy); }
  .modal .row button.primary { background: var(--accent); color: #fff; }
  .modal .row button:disabled { opacity: .5; cursor: default; }
  .classbar { font-size: .85rem; background: #ffd666; color: var(--navy); border-radius: 20px; padding: 3px 10px; font-weight: 600; white-space: nowrap; }
  .classbar[hidden] { display: none; }
  .classbar.bad { background: #ffd1cc; }

  @media (max-width: 860px) {
    main { flex-direction: column; }
    aside { width: auto; border-left: 0; border-top: 1px solid var(--line); max-height: 42vh; }
    .lib { flex-direction: row; flex-wrap: wrap; }
    .item { flex: 1 1 140px; }
    header .task { display: none; }
  }
</style>
</head>
<body>

<header>
  <h1>大气受热过程 · 小组拖拽建模</h1>
  <span class="classbar" id="classBar" hidden></span>
  <div class="task" id="toolTask">小组任务：把右侧辐射箭头拖到图中合适位置，拖动箭头两端调整方向和长短，拖动侧边方块调整粗细，搭建大气受热过程模型，完成后点“存入作品墙”。允许出错。</div>
  <div class="tools">
    <button id="bCloud">☁️ 隐藏云层</button>
    <span class="sep"></span>
    <button id="bUndo" title="撤销 (Ctrl+Z)">↶ 撤销</button>
    <button id="bRedo" title="重做 (Ctrl+Y)">↷ 重做</button>
    <button id="bDel" title="删除选中 (Delete)">🗑 删除</button>
    <button id="bClear">🔄 清空</button>
    <span class="sep"></span>
    <button id="bShot">📸 保存图片</button>
    <button id="bPin" class="on">📌 存入作品墙</button>
    <button id="bWall">🖼 作品墙</button>
    <button id="bFull">⛶ 全屏</button>
  </div>
</header>

<main>
  <div class="stage">
    <svg id="scene" viewBox="0 0 1000 625" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
      <g id="base"></g>
      <g id="arrows"></g>
      <g id="ui"></g>
    </svg>
    <div class="tip">拖动箭头移动 · 拖动两端圆点改变方向和长短 · 拖动侧边方块改变粗细（或按 [ ]） · 按住 Shift 以 15° 对齐</div>
  </div>

  <aside>
    <h2>辐射箭头素材库 <small>拖入或点击添加</small></h2>
    <div class="legend"><span><i style="background:var(--sw)"></i>太阳短波辐射</span><span><i style="background:var(--lw)"></i>长波辐射</span></div>
    <div class="lib" id="lib"></div>
    <div class="group">
      <label for="groupName">小组名称（会写在保存的图片上）</label>
      <input id="groupName" placeholder="例如：第 3 组" maxlength="20">
    </div>
  </aside>
</main>

<div class="toast" id="toast"></div>

<!-- 作品墙：所有小组的作品保存在这台机器的浏览器里 -->
<div class="wall" id="wall" hidden>
  <div class="wall-head">
    <h2>🖼 作品墙</h2><small id="wallCount"></small>
    <div class="tools">
      <button id="wClear">🗑 清空作品墙</button>
      <button id="wClose">✕ 返回画布</button>
    </div>
  </div>
  <div class="wall-grid" id="wallGrid"></div>
  <div class="wall-empty">作品墙还是空的<br><small>每组完成后，点顶部的“📌 存入作品墙”</small></div>
</div>

<div class="view" id="view" hidden>
  <div class="wall-head">
    <h2 id="viewName"></h2><small id="viewMeta"></small>
    <div class="tools">
      <button id="vLoad">✏️ 载入画布修改</button>
      <button id="vShot">📸 保存图片</button>
      <button id="vDel">🗑 删除</button>
      <button id="vClose">✕ 返回作品墙</button>
    </div>
  </div>
  <button class="nav prev" id="vPrev" title="上一组 (←)">‹</button>
  <div class="big" id="viewBig"></div>
  <button class="nav next" id="vNext" title="下一组 (→)">›</button>
</div>

<!-- 课堂模式：提交给老师 -->
<div class="modal" id="submit" hidden>
  <div class="box">
    <h3>📤 提交给老师</h3>
    <p>提交后，作品会出现在老师的作品墙上，全班都能看到。可以修改后再次提交，以最后一次为准。</p>
    <label for="sName">小组名称</label>
    <input id="sName" maxlength="20" placeholder="例如：第 3 组">
    <label for="sNote">我们的说明（选填）：模型想表达什么？哪支箭头最关键？</label>
    <textarea id="sNote" maxlength="300" placeholder="例如：大气逆辐射把热量还给地面，起到保温作用……"></textarea>
    <div class="row">
      <button id="sCancel">取消</button>
      <button id="sGo" class="primary">提交</button>
    </div>
  </div>
</div>

<script src="scene.js"></script>
<script>
(() => {
  const { W, H, LIB, CFG, W_MIN, W_MAX, el, clamp, aw, drawBase, drawArrowShape, labelSide, placeLabel,
    buildStaticSvg, exportPng, fmtTime } = GeoScene;
  const CLASS = GeoScene.readClass();   // 通过老师的上课链接打开时为课堂模式

  // ---------- 状态 ----------
  let arrows = [];
  let selected = null;
  let showCloud = true;
  let undoStack = [], redoStack = [];
  const STORE = 'atmos-heating-model-v1';

  const $ = id => document.getElementById(id);
  const svg = $('scene'), gBase = $('base'), gArrows = $('arrows'), gUI = $('ui');

  const drawMainBase = () => drawBase(gBase, showCloud);

  // 粗细：每支箭头可单独设置，旧数据回退到素材默认值
  const W_GAP = 14;
  // 粗细手柄放在箭头中点、与标签相反的一侧
  function widthHandle(a) {
    const dx = a.x2 - a.x1, dy = a.y2 - a.y1, len = Math.hypot(dx, dy) || 1;
    let nx = -dy / len, ny = dx / len;
    const { vertical, side } = labelSide(a);
    if (vertical ? Math.sign(nx) === side : ny < 0) { nx = -nx; ny = -ny; }
    const mx = (a.x1 + a.x2) / 2, my = (a.y1 + a.y2) / 2, d = aw(a) / 2 + W_GAP;
    return { mx, my, nx, ny, x: mx + nx * d, y: my + ny * d };
  }

  // ---------- 箭头层 ----------
  function renderArrows() {
    gArrows.innerHTML = '';
    gUI.innerHTML = '';
    arrows.forEach(a => {
      const c = CFG[a.key];
      const g = el('g', { class: 'arrow', 'data-id': a.id }, gArrows);
      if (a.id === selected) g.setAttribute('filter', 'url(#sel)');
      el('line', { x1: a.x1, y1: a.y1, x2: a.x2, y2: a.y2, stroke: 'transparent', 'stroke-width': Math.max(34, aw(a) + 26), 'stroke-linecap': 'round', 'data-part': 'body' }, g);
      const shape = el('g', { 'pointer-events': 'none' }, g);
      drawArrowShape(shape, a.x1, a.y1, a.x2, a.y2, aw(a), c.color);
      const t = placeLabel(g, a, c.label, 19);
      t.setAttribute('data-part', 'body');
    });
    const s = arrows.find(a => a.id === selected);
    if (s) {
      [['tail', s.x1, s.y1, '#ffffff', '#1f8fc4'], ['head', s.x2, s.y2, '#1f8fc4', '#ffffff']].forEach(([part, x, y, f, st]) => {
        el('circle', { cx: x, cy: y, r: 22, fill: 'transparent', class: 'handle', 'data-id': s.id, 'data-part': part }, gUI);
        el('circle', { cx: x, cy: y, r: 9, fill: f, stroke: st, 'stroke-width': 3, 'pointer-events': 'none' }, gUI);
      });
      const h = widthHandle(s);
      el('line', { x1: h.mx, y1: h.my, x2: h.x, y2: h.y, stroke: '#1f8fc4', 'stroke-width': 2, 'stroke-dasharray': '3 3', 'pointer-events': 'none' }, gUI);
      el('circle', { cx: h.x, cy: h.y, r: 22, fill: 'transparent', class: 'handle wh', 'data-id': s.id, 'data-part': 'width' }, gUI);
      const ang = Math.atan2(h.ny, h.nx) * 180 / Math.PI;
      const hg = el('g', { transform: `translate(${h.x} ${h.y}) rotate(${ang})`, 'pointer-events': 'none' }, gUI);
      el('rect', { x: -9, y: -9, width: 18, height: 18, rx: 3, fill: '#fff', stroke: '#1f8fc4', 'stroke-width': 3 }, hg);
      el('path', { d: 'M-4,-3 L-4,3 M4,-3 L4,3', stroke: '#1f8fc4', 'stroke-width': 2, 'stroke-linecap': 'round' }, hg);
    }
    $('bDel').disabled = !s;
    $('bUndo').disabled = !undoStack.length;
    $('bRedo').disabled = !redoStack.length;
    updateCounts();
    save();
  }

  // ---------- 历史 ----------
  const snap = () => JSON.stringify(arrows);
  function commit(before) {
    if (before === snap()) return;
    undoStack.push(before);
    if (undoStack.length > 100) undoStack.shift();
    redoStack = [];
  }
  function undo() {
    if (!undoStack.length) return;
    redoStack.push(snap());
    arrows = JSON.parse(undoStack.pop());
    if (!arrows.some(a => a.id === selected)) selected = null;
    renderArrows();
  }
  function redo() {
    if (!redoStack.length) return;
    undoStack.push(snap());
    arrows = JSON.parse(redoStack.pop());
    renderArrows();
  }

  function save() {
    try { localStorage.setItem(STORE, JSON.stringify({ arrows, group: $('groupName').value, showCloud })); } catch (e) {}
  }
  function load() {
    try {
      const d = JSON.parse(localStorage.getItem(STORE) || 'null');
      if (d && Array.isArray(d.arrows)) {
        arrows = d.arrows.filter(a => CFG[a.key]);
        $('groupName').value = d.group || '';
        showCloud = d.showCloud !== false;
      }
    } catch (e) {}
  }

  // ---------- 坐标 ----------
  function toSvg(cx, cy) {
    const p = svg.createSVGPoint(); p.x = cx; p.y = cy;
    const q = p.matrixTransform(svg.getScreenCTM().inverse());
    return { x: q.x, y: q.y };
  }
  function overScene(cx, cy) {
    const r = svg.getBoundingClientRect();
    return cx >= r.left && cx <= r.right && cy >= r.top && cy <= r.bottom;
  }

  let nextId = Date.now();
  function addArrow(key, x, y) {
    const before = snap();
    const c = CFG[key];
    x = clamp(x, c.len / 2 + 10, W - c.len / 2 - 10);
    y = clamp(y, 20, H - 20);
    const a = { id: nextId++, key, x1: x - c.len / 2, y1: y, x2: x + c.len / 2, y2: y };
    arrows.push(a);
    selected = a.id;
    commit(before);
    renderArrows();
  }

  // ---------- 画布交互（Pointer Events，鼠标/触屏/笔通用） ----------
  let drag = null;
  svg.addEventListener('pointerdown', e => {
    const t = e.target.closest('[data-part]');
    if (!t) { if (selected !== null) { selected = null; renderArrows(); } return; }
    const id = Number(t.getAttribute('data-id') || t.closest('[data-id]').getAttribute('data-id'));
    const a = arrows.find(x => x.id === id);
    if (!a) return;
    e.preventDefault();
    selected = id;
    const p = toSvg(e.clientX, e.clientY);
    drag = { id, part: t.getAttribute('data-part'), start: p, orig: { ...a }, before: snap() };
    // 选中的箭头置顶
    arrows = arrows.filter(x => x.id !== id).concat(a);
    svg.setPointerCapture(e.pointerId);
    renderArrows();
  });
  svg.addEventListener('pointermove', e => {
    if (!drag) return;
    const a = arrows.find(x => x.id === drag.id);
    const p = toSvg(e.clientX, e.clientY);
    const o = drag.orig;
    if (drag.part === 'width') {
      const h = widthHandle(o);
      const d = Math.abs((p.x - h.mx) * h.nx + (p.y - h.my) * h.ny);
      a.w = Math.round(clamp((d - W_GAP) * 2, W_MIN, W_MAX));
    } else if (drag.part === 'body') {
      let dx = p.x - drag.start.x, dy = p.y - drag.start.y;
      dx = clamp(dx, -Math.min(o.x1, o.x2), W - Math.max(o.x1, o.x2));
      dy = clamp(dy, -Math.min(o.y1, o.y2), H - Math.max(o.y1, o.y2));
      Object.assign(a, { x1: o.x1 + dx, y1: o.y1 + dy, x2: o.x2 + dx, y2: o.y2 + dy });
    } else {
      const fx = drag.part === 'head' ? o.x1 : o.x2, fy = drag.part === 'head' ? o.y1 : o.y2;
      let x = clamp(p.x, 0, W), y = clamp(p.y, 0, H);
      let ang = Math.atan2(y - fy, x - fx), len = Math.max(40, Math.hypot(x - fx, y - fy));
      if (e.shiftKey) ang = Math.round(ang / (Math.PI / 12)) * (Math.PI / 12);
      x = fx + Math.cos(ang) * len; y = fy + Math.sin(ang) * len;
      if (drag.part === 'head') { a.x2 = x; a.y2 = y; } else { a.x1 = x; a.y1 = y; }
    }
    renderArrows();
  });
  const endDrag = () => { if (drag) { commit(drag.before); drag = null; renderArrows(); } };
  svg.addEventListener('pointerup', endDrag);
  svg.addEventListener('pointercancel', endDrag);

  // ---------- 素材库（Pointer 拖拽，触屏可用；点击直接添加） ----------
  function buildLib() {
    const lib = $('lib');
    LIB.forEach(c => {
      const item = document.createElement('div');
      item.className = 'item';
      item.innerHTML = `<svg width="64" height="26" viewBox="0 0 64 26"></svg><span>${c.label}</span><em class="count" data-count="${c.key}"></em>`;
      drawArrowShape(item.querySelector('svg'), 4, 13, 60, 13, Math.max(4, c.w * .7), c.color);
      item.addEventListener('pointerdown', e => startLibDrag(e, c, item));
      lib.appendChild(item);
    });
  }
  function updateCounts() {
    document.querySelectorAll('[data-count]').forEach(e => {
      const n = arrows.filter(a => a.key === e.dataset.count).length;
      e.textContent = n ? `×${n}` : '';
    });
  }
  function startLibDrag(e, c, item) {
    e.preventDefault();
    const sx = e.clientX, sy = e.clientY;
    let ghost = null;
    item.setPointerCapture(e.pointerId);
    const move = ev => {
      if (!ghost && Math.hypot(ev.clientX - sx, ev.clientY - sy) > 6) {
        ghost = document.createElement('div');
        ghost.className = 'ghost';
        ghost.innerHTML = item.innerHTML;
        document.body.appendChild(ghost);
      }
      if (ghost) ghost.style.left = ev.clientX + 'px', ghost.style.top = ev.clientY + 'px';
    };
    const up = ev => {
      item.removeEventListener('pointermove', move);
      item.removeEventListener('pointerup', up);
      item.removeEventListener('pointercancel', up);
      if (ghost) {
        ghost.remove();
        if (overScene(ev.clientX, ev.clientY)) {
          const p = toSvg(ev.clientX, ev.clientY);
          addArrow(c.key, p.x, p.y);
        }
      } else if (ev.type === 'pointerup') {
        // 点击：放在画面中部，逐个错开
        const n = arrows.length % 6;
        addArrow(c.key, 250 + (n % 3) * 250, 320 + Math.floor(n / 3) * 90);
        toast('已添加到画面中部，拖动到合适位置');
      }
    };
    item.addEventListener('pointermove', move);
    item.addEventListener('pointerup', up);
    item.addEventListener('pointercancel', up);
  }

  // ---------- 按钮 ----------
  $('bCloud').onclick = () => {
    showCloud = !showCloud;
    $('bCloud').textContent = showCloud ? '☁️ 隐藏云层' : '☁️ 显示云层';
    drawMainBase(); save();
  };
  $('bUndo').onclick = undo;
  $('bRedo').onclick = redo;
  $('bDel').onclick = () => {
    if (selected === null) return;
    const before = snap();
    arrows = arrows.filter(a => a.id !== selected);
    selected = null;
    commit(before); renderArrows();
  };
  $('bClear').onclick = () => {
    if (!arrows.length) return;
    if (!confirm('确定清空画布上的所有箭头吗？（可以用“撤销”恢复）')) return;
    const before = snap();
    arrows = []; selected = null;
    commit(before); renderArrows();
  };
  $('bFull').onclick = () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
  };
  $('groupName').addEventListener('input', save);

  window.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (!$('submit').hidden) { if (e.key === 'Escape') $('submit').hidden = true; return; }
    if (!$('view').hidden) {
      if (e.key === 'ArrowLeft') $('vPrev').onclick();
      else if (e.key === 'ArrowRight') $('vNext').onclick();
      else if (e.key === 'Escape') closeView();
      return;
    }
    if (!$('wall').hidden) { if (e.key === 'Escape') closeWall(); return; }
    if ((e.key === 'Delete' || e.key === 'Backspace') && selected !== null) { e.preventDefault(); $('bDel').onclick(); }
    else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
    else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); }
    else if (e.key === 'Escape') { selected = null; renderArrows(); }
    else if ((e.key === '[' || e.key === ']') && selected !== null) {
      const a = arrows.find(x => x.id === selected), before = snap();
      a.w = clamp(aw(a) + (e.key === ']' ? 2 : -2), W_MIN, W_MAX);
      commit(before); renderArrows();
    }
  });

  // ---------- 保存图片（2 倍清晰度，带小组名与时间） ----------
  const savePng = m => exportPng(m).then(() => toast('图片已保存'), () => toast('图片保存失败'));
  $('bShot').onclick = () => savePng({ arrows, showCloud, name: $('groupName').value });

  // ---------- 作品墙：各组作品存在这台机器的浏览器里，互相可见 ----------
  const WALL = 'atmos-heating-wall-v1';
  let works = [];
  let viewIdx = -1;
  function loadWorks() {
    try { works = JSON.parse(localStorage.getItem(WALL) || '[]'); } catch (e) { works = []; }
    if (!Array.isArray(works)) works = [];
  }
  function saveWorks() {
    try { localStorage.setItem(WALL, JSON.stringify(works)); } catch (e) { toast('保存失败：浏览器存储不可用'); }
    updateWallBtn();
  }
  function updateWallBtn() {
    $('bWall').textContent = works.length ? `🖼 作品墙 ${works.length}` : '🖼 作品墙';
  }
  $('bPin').onclick = () => {
    if (!arrows.length) { toast('画布上还没有箭头'); return; }
    if (CLASS) { openSubmit(); return; }
    let name = $('groupName').value.trim();
    if (!name) {
      name = (prompt('请输入小组名称', '') || '').trim();
      if (!name) return;
      $('groupName').value = name; save();
    }
    const i = works.findIndex(w => w.name === name);
    if (i >= 0 && !confirm(`作品墙上已有“${name}”的作品，要覆盖吗？`)) return;
    const w = { name, arrows: JSON.parse(snap()), showCloud, time: Date.now() };
    if (i >= 0) works[i] = w; else works.push(w);
    saveWorks();
    if (confirm(`已存入作品墙（共 ${works.length} 组）。\n清空画布，让下一组开始？`)) {
      const before = snap();
      arrows = []; selected = null; $('groupName').value = '';
      commit(before); renderArrows();
    } else {
      toast(`已存入作品墙，共 ${works.length} 组`);
    }
  };

  function renderWall() {
    const grid = $('wallGrid');
    grid.innerHTML = '';
    $('wallCount').textContent = works.length ? `共 ${works.length} 组 · 点击作品放大查看` : '';
    works.forEach((w, i) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.appendChild(buildStaticSvg(w));
      const cap = document.createElement('div');
      cap.className = 'cap';
      cap.innerHTML = '<b></b><span></span><small></small>';
      cap.querySelector('b').textContent = w.name;
      cap.querySelector('span').textContent = `${w.arrows.length} 支箭头`;
      cap.querySelector('small').textContent = fmtTime(w.time);
      card.appendChild(cap);
      card.onclick = () => openView(i);
      grid.appendChild(card);
    });
  }
  function openWall() { renderWall(); $('wall').hidden = false; }
  function closeWall() { $('wall').hidden = true; }
  $('bWall').onclick = () => {
    if (CLASS) window.open('wall.html' + GeoScene.classHash(CLASS), 'geo-lab-wall');
    else openWall();
  };
  $('wClose').onclick = closeWall;
  $('wClear').onclick = () => {
    if (!works.length) return;
    if (!confirm(`清空作品墙上全部 ${works.length} 组作品？此操作不能撤销。`)) return;
    works = []; saveWorks(); renderWall();
  };

  function openView(i) {
    const w = works[i];
    if (!w) { closeView(); return; }
    viewIdx = i;
    $('viewName').textContent = w.name;
    $('viewMeta').textContent = `${w.arrows.length} 支箭头 · ${fmtTime(w.time)} · 第 ${i + 1} / ${works.length} 个`;
    const big = $('viewBig');
    big.innerHTML = '';
    big.appendChild(buildStaticSvg(w));
    $('vPrev').disabled = i === 0;
    $('vNext').disabled = i === works.length - 1;
    $('view').hidden = false;
  }
  function closeView() { $('view').hidden = true; viewIdx = -1; }
  $('vPrev').onclick = () => { if (viewIdx > 0) openView(viewIdx - 1); };
  $('vNext').onclick = () => { if (viewIdx < works.length - 1) openView(viewIdx + 1); };
  $('vClose').onclick = closeView;
  $('vShot').onclick = () => savePng(works[viewIdx]);
  $('vDel').onclick = () => {
    const w = works[viewIdx];
    if (!w || !confirm(`删除“${w.name}”的作品？`)) return;
    works.splice(viewIdx, 1);
    saveWorks(); renderWall();
    if (works.length) openView(Math.min(viewIdx, works.length - 1)); else closeView();
  };
  $('vLoad').onclick = () => {
    const w = works[viewIdx];
    if (!w) return;
    if (arrows.length && !confirm('画布上已有内容，载入会替换它（可以撤销）。继续？')) return;
    const before = snap();
    arrows = JSON.parse(JSON.stringify(w.arrows)).filter(a => CFG[a.key]);
    selected = null;
    showCloud = w.showCloud !== false;
    $('groupName').value = w.name;
    $('bCloud').textContent = showCloud ? '☁️ 隐藏云层' : '☁️ 显示云层';
    drawMainBase();
    commit(before); renderArrows();
    closeView(); closeWall();
    toast(`已载入“${w.name}”的作品，修改后可再次存入`);
  };

  let toastTimer;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
  }

  // ---------- 课堂模式：提交到老师的作品墙（GitHub 仓库里这节课的 issue） ----------
  let lastNote = '';
  function openSubmit() {
    $('sName').value = $('groupName').value.trim();
    $('sNote').value = lastNote;
    $('sGo').disabled = false; $('sGo').textContent = '提交';
    $('submit').hidden = false;
    ($('sName').value ? $('sNote') : $('sName')).focus();
  }
  $('sCancel').onclick = () => { $('submit').hidden = true; };
  $('sGo').onclick = async () => {
    const name = $('sName').value.trim();
    if (!name) { toast('请填写小组名称'); $('sName').focus(); return; }
    $('groupName').value = name; save();
    lastNote = $('sNote').value.trim();
    $('sGo').disabled = true; $('sGo').textContent = '提交中…';
    try {
      await GeoScene.submitWork(CLASS, { name, note: lastNote, arrows, showCloud });
      $('submit').hidden = true;
      toast('提交成功！可以点“全班作品”看看其他组');
    } catch (e) {
      $('sGo').disabled = false; $('sGo').textContent = '重新提交';
      toast('提交失败：' + (e.status ? e.message : '网络连接不上 GitHub，请稍后重试'));
    }
  };
  function initClass() {
    $('bPin').textContent = '📤 提交给老师';
    $('bWall').textContent = '🖼 全班作品';
    $('classBar').hidden = false;
    $('classBar').textContent = '课堂模式';
    $('toolTask').textContent = '小组任务：把右侧辐射箭头拖到图中合适位置，拖动箭头两端调整方向和长短，拖动侧边方块调整粗细，搭建大气受热过程模型，完成后点“提交给老师”。允许出错。';
    GeoScene.loadClass(CLASS).then(
      d => { $('classBar').textContent = '课堂：' + d.title; },
      e => { $('classBar').textContent = '课堂连接失败'; $('classBar').classList.add('bad'); toast(e.status ? e.message : '网络连接不上 GitHub'); });
  }

  // ---------- 启动 ----------
  load();
  loadWorks();
  if (CLASS) initClass(); else updateWallBtn();
  $('bCloud').textContent = showCloud ? '☁️ 隐藏云层' : '☁️ 显示云层';
  drawMainBase();
  buildLib();
  renderArrows();
})();
</script>
</body>
</html>
